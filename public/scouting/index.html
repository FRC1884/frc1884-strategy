<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FRC 1884 · Scouting sim</title>
<style>
  :root{
    --ink:#14171c; --ink-soft:#5a626d; --paper:#f4f5f2; --panel:#fff; --line:#dcdfd9;
    --red:#c8362f; --red-tint:#fbeceb; --blue:#2f5bc8; --blue-tint:#e9eefb;
    --gold:#c79a2f; --gold-tint:#faf2d8; --good:#2f8a5b;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.45}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px 80px}

  /* masthead */
  .mast{position:sticky;top:0;z-index:5;background:var(--paper);display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:2px solid var(--ink)}
  .team{font-family:var(--mono);font-weight:700;letter-spacing:.04em;background:var(--ink);color:var(--paper);
    padding:3px 9px;border-radius:4px}
  .mast h1{font-size:.95rem;margin:0;font-weight:650}
  .mast .ev{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft)}
  .mast .spacer{flex:1}
  .modes{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
  .modes button{padding:7px 14px;border:0;background:transparent;font-weight:600;font-size:.85rem}
  .modes button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
  .reset{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:.78rem;color:var(--ink-soft)}
  #headerControls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .userchip{font-family:var(--mono);font-size:.76rem;background:var(--gold-tint);border:1px solid var(--gold);color:#7a5d10;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .homeback{font-family:var(--mono);font-size:.74rem;text-decoration:none;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap}
  .homeback:hover{border-color:var(--ink);color:var(--ink)}

  .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:26px 0 10px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .muted{color:var(--ink-soft)}
  .sub{font-size:.82rem;color:var(--ink-soft)}

  /* sim badge */
  .simflag{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    background:var(--gold-tint);color:#7a5d10;border:1px solid var(--gold);border-radius:999px;padding:2px 8px}

  /* match header */
  .matchhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .matchhead .qm{font-family:var(--mono);font-size:1.5rem;font-weight:700}
  .field{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .side{border-radius:10px;padding:10px}
  .side[data-a="red"]{background:var(--red-tint);border:1.5px solid var(--red)}
  .side[data-a="blue"]{background:var(--blue-tint);border:1.5px solid var(--blue)}
  .side h3{margin:0 0 8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
  .side[data-a="red"] h3{color:var(--red)} .side[data-a="blue"] h3{color:var(--blue)}
  .chip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:7px}
  .chip .n{font-family:var(--mono);font-weight:700;font-size:1.05rem}
  .chip .nm{font-size:.78rem}
  .chip .ctx{font-family:var(--mono);font-size:.68rem;color:var(--ink-soft);margin-top:2px}
  .chip.ours{outline:2px solid var(--gold);outline-offset:1px}
  .tag-our{font-family:var(--mono);font-size:.6rem;color:#7a5d10;background:var(--gold-tint);border-radius:4px;padding:1px 5px;margin-left:4px}

  .btn{font-weight:650;padding:12px 18px;border-radius:9px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#231900}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.rec{background:var(--red);border-color:var(--red)}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}

  /* recorder */
  .recorder{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 16px}
  .reclamp{width:14px;height:14px;border-radius:999px;background:var(--red);display:inline-block;margin-right:8px}
  @media (prefers-reduced-motion:no-preference){.live .reclamp{animation:pulse 1s infinite}}
  @keyframes pulse{50%{opacity:.25}}
  .clock{font-family:var(--mono);font-size:2.6rem;font-weight:700;letter-spacing:.02em}
  .phasebar{display:flex;gap:4px;width:100%;max-width:420px}
  .phasebar div{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .phasebar div.on{background:var(--gold)}
  .vidframe{position:relative;width:100%;max-width:520px;aspect-ratio:16/9;background:#0d0f12;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .vidframe video{width:100%;height:100%;object-fit:cover;display:block;background:#0d0f12}
  .camfallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cdd2cb;font-size:.84rem;text-align:center;padding:18px;background:#15181d;line-height:1.5}
  .recbadge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.55);color:#fff;font-family:var(--mono);font-weight:700;font-size:.9rem;padding:5px 11px;border-radius:999px}
  .recbadge .reclamp{margin-right:0}

  /* processing */
  .proc{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px}
  .spinner{width:34px;height:34px;border-radius:999px;border:3px solid var(--line);border-top-color:var(--gold)}
  @media (prefers-reduced-motion:no-preference){.spinner{animation:spin .8s linear infinite}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ai results */
  .airow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .airow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .a-red{border-left:4px solid var(--red)} .a-blue{border-left:4px solid var(--blue)}
  .est{font-family:var(--mono);font-weight:700}
  .conf{font-family:var(--mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:1px 6px}
  .conf.high{background:#e7f3ec;color:var(--good)} .conf.medium{background:var(--gold-tint);color:#7a5d10} .conf.low{background:var(--red-tint);color:var(--red)}
  .airow .line{font-size:.85rem;margin-top:5px}
  .airow .line b{font-weight:650}
  .ournote{background:var(--gold-tint);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 12px;margin:6px 0 0;font-size:.9rem}

  /* rating grid */
  .ratehead{display:flex;justify-content:space-between;align-items:baseline}
  .progress{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft)}
  .rrow{border-bottom:1px solid var(--line);padding:12px 0}
  .rrow:last-child{border-bottom:0}
  .rrow .who{font-family:var(--mono);font-weight:700;margin-bottom:6px}
  .rrow .who .al{font-size:.62rem;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:middle}
  .al.red{background:var(--red-tint);color:var(--red)} .al.blue{background:var(--blue-tint);color:var(--blue)}
  .axis{display:flex;align-items:center;gap:8px;margin:5px 0}
  .axis .lab{font-size:.74rem;width:62px;color:var(--ink-soft)}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .rchip{border:1.4px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:.78rem;font-family:var(--mono)}
  .rchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .rchip.ne[aria-pressed="true"]{background:var(--ink-soft);border-color:var(--ink-soft)}
  textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:10px;min-height:64px;resize:vertical}
  .err{color:var(--red);font-size:.82rem;margin-top:8px;font-weight:600}
  .done{text-align:center;padding:30px}
  .done .big{font-size:2rem}

  /* analyst table */
  .legend{font-size:.78rem;color:var(--ink-soft);margin:-4px 0 10px;display:flex;gap:14px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:999px;display:inline-block;vertical-align:middle;margin-right:4px}
  .dot.full{background:var(--good)} .dot.part{background:var(--gold)} .dot.none{background:var(--red)}
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.84rem}
  th,td{text-align:right;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
  thead th{font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;user-select:none}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--gold-tint)}
  .pill{font-family:var(--mono);font-size:.72rem;padding:2px 7px;border-radius:5px}
  .pill.exceptional{background:#dff0e6;color:var(--good)} .pill.good{background:#e7f3ec;color:var(--good)}
  .pill.average{background:var(--gold-tint);color:#7a5d10} .pill.bad{background:var(--red-tint);color:var(--red)}
  .pill.none{background:#eef0ec;color:var(--ink-soft)}
  .bar{height:8px;border-radius:4px;background:var(--blue);display:inline-block;vertical-align:middle}

  .empty{padding:30px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:12px}
  .back{border:0;background:none;color:var(--blue);font-weight:600;padding:0;margin-bottom:8px}
  .kv{display:flex;gap:8px;font-size:.85rem;margin:3px 0}
  .kv .k{color:var(--ink-soft);min-width:120px}
  select{font:inherit;font-family:var(--mono);padding:10px;border:1.5px solid var(--line);border-radius:9px;width:100%}
  .help{font-size:.78rem;color:var(--ink-soft);margin-top:6px}

  /* analyst dashboard */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi .v{font-family:var(--mono);font-size:1.45rem;font-weight:700;line-height:1.1}
  .kpi .l{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .card h4{margin:0;font-size:.86rem}
  .card .cap{font-size:.7rem;color:var(--ink-soft);margin:1px 0 6px}
  .chart{width:100%;height:auto;display:block}
  .chart .axl{font:600 9px var(--mono);fill:var(--ink-soft)}
  .chart .ptl{font:600 9px var(--mono);fill:var(--ink)}
  .chart .qlab{font:600 8.5px var(--mono);fill:#b3b8b1}
  .notesfeed .item{border-left:3px solid var(--gold);background:var(--gold-tint);border-radius:0 8px 8px 0;padding:8px 11px;margin-bottom:6px;font-size:.86rem}

  /* field playback */
  .subnav{display:flex;gap:8px;margin-bottom:14px}
  .subnav button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-weight:600;font-size:.85rem}
  .subnav button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .field{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}
  .pcontrols{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .pbtn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;font-weight:650}
  .pbtn.ghost{background:#fff;color:var(--ink);padding:9px 13px}
  .pclock{font-family:var(--mono);font-weight:700;font-size:1.2rem;min-width:58px}
  .scrub{flex:1;min-width:130px;accent-color:var(--gold)}
  .speed{font-family:var(--mono);border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-weight:600}
  .pmatchsel{font-family:var(--mono);padding:8px;border:1.5px solid var(--line);border-radius:8px;width:auto}
  .robot text{font:700 8px var(--mono);text-anchor:middle;dominant-baseline:central}

  /* griffins1884.org content tabs */
  .subnav{flex-wrap:wrap}
  .banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .banner{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);border-top:4px solid var(--gold)}
  .banner.wf{border-top-color:var(--blue)}
  .banner .yr{font-family:var(--mono);font-size:.72rem;color:var(--ink-soft)}
  .banner .aw{font-weight:700;margin:3px 0;font-size:.96rem}
  .banner .ev{font-size:.84rem;color:var(--ink-soft)}
  .timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
  .tl{position:relative;margin-bottom:16px}
  .tl:last-child{margin-bottom:0}
  .tl::before{content:"";position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:999px;background:var(--gold);border:2px solid var(--paper)}
  .tl .yr{font-family:var(--mono);font-weight:700}
  .applinks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
  .applink{border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;display:block}
  .applink:hover{border-color:var(--gold);background:var(--gold-tint)}
  .applink h4{margin:0 0 4px;font-size:.92rem}
  .applink .d{font-size:.83rem;color:var(--ink-soft)}
  .newtag{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;background:var(--good);color:#fff;border-radius:4px;padding:1px 5px;vertical-align:middle}
  .social{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .social a{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none;color:var(--ink)}
  .social a:hover{border-color:var(--ink)}
  .teamhero img{height:42px;width:auto;display:block;margin-bottom:6px}
  .discl{font-size:.78rem;color:var(--ink-soft);margin-top:14px;font-style:italic}
  @media(max-width:560px){.applinks{grid-template-columns:1fr}}

  /* strategy sub-app (mirrors griffins1884.org/strategy) */
  .stratnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .stratnav button{border:1.5px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:.78rem;font-weight:600}
  .stratnav button[aria-current="true"]{background:var(--gold);border-color:var(--gold);color:#231900}
  .sref{width:100%;border-collapse:collapse;font-size:.86rem}
  .sref td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left}
  .sref td:last-child{text-align:right;font-family:var(--mono);font-weight:700}
  .defcard{background:var(--blue-tint);border:1px solid var(--blue);border-radius:12px;padding:14px}
  .defcard h4{margin:0 0 8px;color:var(--blue)}
  .defcard ul{margin:0;padding-left:18px}
  .defcard li{font-size:.86rem;margin:4px 0}
  .hub{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
  .hub .cell{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
  .hub .cell .p{font-family:var(--mono);font-weight:700;font-size:.78rem}
  .hub .act-red{background:var(--red-tint);border-color:var(--red)}
  .hub .act-blue{background:var(--blue-tint);border-color:var(--blue)}
  .pitgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .pitbox{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-family:var(--mono);font-weight:700;font-size:.9rem;background:#fff}
  #stratcanvas{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}

  /* per-phase field-map editor */
  .boardfield{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);touch-action:none;background:#eef1ec}
  .btoolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
  .btool{border:1.5px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:.76rem;font-weight:600}
  .btool[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .swatch{width:22px;height:22px;border-radius:6px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
  .swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
  .brobot{cursor:grab}
  .brobot text{font:700 11px var(--mono);text-anchor:middle;dominant-baseline:central}
  .hubtable{width:100%;border-collapse:collapse;font-size:.74rem;font-family:var(--mono)}
  .hubtable th,.hubtable td{border:1px solid var(--line);padding:5px 6px;text-align:center}
  .hubtable th{background:#f1f3ef;font-size:.66rem;text-transform:uppercase;letter-spacing:.04em}
  .hubtable tr.hi{background:var(--red-tint)}
  .phaselab{display:inline-block;font-family:var(--mono);font-weight:700;font-size:.72rem;padding:2px 8px;border-radius:5px;margin-bottom:4px}
  .phaselab.auto{background:var(--gold-tint);color:#7a5d10}
  .phaselab.teleop{background:#e7f3ec;color:var(--good)}
  @media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="mast">
  <a class="homeback" href="/" title="Back to griffins1884.org">← Home</a>
  <span class="team">1884</span>
  <div>
    <h1 id="modeTitle">Scout</h1>
    <div class="ev">REBUILT 2026 · Newton (sim) <span class="simflag">simulated data</span></div>
  </div>
  <span class="spacer"></span>
  <div id="headerControls"></div>
</header>

/* =========================================================================
   SIMULATION — self-contained, in-memory. No network, no storage.
   Mirrors the real flow: scout picks name -> current match shown automatically
   -> record -> (simulated) AI per-robot analysis grounded in season stats ->
   MANDATORY scoring+defence ratings -> optional sentence -> analyst reads it.
   ========================================================================= */

const OUR = 1884;
let USER=null;
const CREDS={
  coach:{pw:'griffins',role:'analyst',name:'Coach'},
  analyst:{pw:'griffins',role:'analyst',name:'Analyst'},
  scout:{pw:'griffins',role:'scout',name:'Scout'},
  maya:{pw:'griffins',role:'scout',name:'Maya'},
};
const RATINGS = ["exceptional","good","average","bad","no_evidence"];
const RLABEL = {exceptional:"Exceptional",good:"Good",average:"Average",bad:"Bad",no_evidence:"No evidence"};
const RSCORE = {exceptional:4,good:3,average:2,bad:1,no_evidence:null};

// --- seed teams (mock REBUILT season stats) -------------------------------
const NAMES = ["Iron Hawks","Voltage","RoboLions","Circuit Surge","Gear Daemons","Titanium","Nova","Quantum","Spartan Bots","Pioneers","Apex","Cyber Wolves","Mecha Owls","Redshift","Blue Forge","Cascade","Vortex","Helix","Ember","Sentinel","Griffins","Comet","Bolt","Forge"];
function mkTeam(num, name, archetype, epa, opr){return {num,name,archetype,epa,opr};}
const ARCH = ["heavy shooter","cycler","defender","hybrid","feeder","climber-focus"];
const TEAMS = {};
let pool = [254,1678,118,148,2056,33,217,1114,624,971,195,5460,3310,4099,1241,2767,1986,4414,67,330];
pool.forEach((num,i)=>{
  const arch = ARCH[i % ARCH.length];
  const epa = Math.round(18 + Math.random()*42);
  const opr = +(epa*0.6 + Math.random()*10).toFixed(1);
  TEAMS[num] = mkTeam(num, NAMES[i], arch, epa, opr);
});
TEAMS[OUR] = mkTeam(OUR, "Griffins", "defender / ferry", 14, 9.2); // our robot: can't shoot/climb

// --- seed match schedule (8 quals) ----------------------------------------
function pick(n, exclude){const opts=Object.keys(TEAMS).map(Number).filter(t=>!exclude.includes(t));const out=[];while(out.length<n){const t=opts[Math.floor(Math.random()*opts.length)];if(!out.includes(t))out.push(t);}return out;}
let MATCHES = [];
function buildSchedule(){
  MATCHES = [];
  for(let i=1;i<=8;i++){
    let used=[];
    // put our team in matches 1,3,6 as the defender
    let red, blue;
    if([1,3,6].includes(i)){ red=[OUR,...pick(2,[OUR])]; used=[...red]; blue=pick(3,used); }
    else { red=pick(3,[]); used=[...red]; blue=pick(3,used); }
    MATCHES.push({key:`2026new_qm${i}`, n:i, red, blue, played:false});
  }
}

// --- state ----------------------------------------------------------------
let MODE="scout";
let SCOUT=null;
let STEP="name";              // name | match | record | process | rate | note | done
let CUR=null;                 // current match object during scout flow
let AI={};                    // teamNum -> generated analysis for CUR
let RGRID={};                 // teamNum -> {scoring, defence}
let STORE={};                 // matchKey -> { obs:{team->ai}, ratings:{team->{s,d}}, note, scout }
const SCOUTS=["Maya","Dev","Priya","Sam"];

function resetSim(){stopCamera();buildSchedule();STORE={};SCOUT=null;STEP="name";CUR=null;AI={};RGRID={};seedPrior();render();}

// pre-record matches 1-2 so Analyst has data immediately
function seedPrior(){
  [0,1].forEach(idx=>{
    const m=MATCHES[idx];
    const ai=genAI(m); const ratings={};
    [...m.red,...m.blue].forEach(t=>{
      const base = TEAMS[t].num===OUR?0:TEAMS[t].epa;
      ratings[t]={scoring: rateFromEpa(base), defence: TEAMS[t].archetype.includes("defender")?"good":pickR(["average","bad","no_evidence"])};
    });
    STORE[m.key]={obs:ai, ratings, note: idx===0?"3310 shut down our ferry lane hard in the last shift.":"", scout:"Dev"};
    m.played=true;
  });
}
function pickR(a){return a[Math.floor(Math.random()*a.length)];}
function rateFromEpa(e){return e>45?"exceptional":e>32?"good":e>20?"average":e>0?"bad":"no_evidence";}

function currentMatch(){return MATCHES.find(m=>!m.played)||null;}

// --- simulated AI per robot (grounded in season stats) --------------------
function splitShifts(total){
  // REBUILT has four shifts; shape a plausible tempo (ramp then slight fade).
  const w=[0.22,0.31,0.28,0.19].map(x=>x*(0.75+Math.random()*0.5));
  const s=w.reduce((a,b)=>a+b,0);
  const out=w.map(x=>Math.round(total*x/s));
  // fix rounding drift onto the largest shift
  const diff=total-out.reduce((a,b)=>a+b,0); out[1]+=diff;
  return out.map(x=>Math.max(0,x));
}
function genAI(m){
  const out={};
  [["red",m.red],["blue",m.blue]].forEach(([al,teams])=>{
    teams.forEach((t,i)=>{
      const T=TEAMS[t];
      const isOur=T.num===OUR;
      const fuel = isOur?0:Math.max(0,Math.round(T.epa*0.7 + (Math.random()*10-5)));
      const conf = pickR(["high","high","medium","medium","low"]);
      out[t]={
        team:t, alliance:al, station:i+1, fuel, conf, shifts: isOur?[0,0,0,0]:splitShifts(fuel),
        didWell: isOur? "Denied the blue feeder lane through three shifts"
          : T.archetype.includes("shooter")? "Fast active-hub cycles, rarely idle"
          : T.archetype.includes("defender")? "Pinned the opposing scorer effectively"
          : "Steady ferrying into the active hub",
        didPoorly: isOur? "Drifted near a climbing opponent at 0:18 — G420 risk" : "",
        vuln: T.archetype.includes("shooter")? "Slow to reset when pushed off the hub line"
          : T.archetype.includes("defender")? "Leaves its own hub undefended when chasing"
          : "Predictable ferry path, easy to intercept",
        summary: isOur? "Defender/ferry; no scoring, disruption-focused match"
          : `~${fuel} fuel, ${T.archetype}; ${conf} ID confidence`
      };
    });
  });
  return out;
}

/* =========================  RENDER  ===================================== */
const view=()=>document.getElementById("view");
function setMode(m){if(m==='analyst'&&(!USER||USER.role!=='analyst'))return;stopPlayer();stopCamera();MODE=m;const t=document.getElementById('modeTitle');if(t)t.textContent=m==='scout'?'Scout':'Analyst';render();}
function renderHeader(){
  const el=document.getElementById('headerControls');if(!el)return;
  if(!USER){el.innerHTML='';return;}
  const modes=`<div class="modes" role="tablist"><button role="tab" aria-selected="${MODE==='scout'}" onclick="setMode('scout')">Scout</button>${USER.role==='analyst'?`<button role="tab" aria-selected="${MODE==='analyst'}" onclick="setMode('analyst')">Analyst</button>`:''}</div>`;
  el.innerHTML=`${modes}<span class="userchip">${USER.name}${USER.role==='scout'?' · scout':''}</span><button class="reset" onclick="logout()">Log out</button>`;
}
function renderLogin(){
  view().innerHTML=`<p class="eyebrow">Sign in</p>
   <div class="panel" style="max-width:420px;margin:16px auto 0">
     <div class="field"><label for="luser">Username</label><input type="text" id="luser" autocomplete="username" placeholder="username"></div>
     <div class="field"><label for="lpass">Password</label><input type="password" id="lpass" autocomplete="current-password" placeholder="password"></div>
     <div id="lerr" class="err" hidden>Unrecognised credentials — see the demo accounts below.</div>
     <div class="actions"><button class="btn" onclick="login()">Log in</button></div>
     <p class="help">Demo accounts (password <b>griffins</b>): <b>coach</b> or <b>analyst</b> → full access (scouting + analysis) · <b>scout</b> or <b>maya</b> → scouting only.</p>
   </div>`;
  const u=document.getElementById('luser');if(u)u.focus();
  const p=document.getElementById('lpass');if(p)p.onkeydown=e=>{if(e.key==='Enter')login();};
}
function login(){
  const u=(document.getElementById('luser').value||'').trim().toLowerCase();
  const p=document.getElementById('lpass').value||'';
  const c=CREDS[u];
  if(!c||c.pw!==p){const e=document.getElementById('lerr');if(e)e.hidden=false;return;}
  USER={name:c.name,role:c.role};
  SCOUT=c.name;STEP='match';CUR=currentMatch();
  MODE=c.role==='analyst'?'analyst':'scout';
  render();
}
function logout(){USER=null;stopPlayer();stopCamera();MODE='scout';STEP='name';render();}

function render(){ renderHeader(); if(!USER){renderLogin();return;} if(MODE==='analyst'&&USER.role!=='analyst')MODE='scout'; MODE==='scout'?renderScout():renderAnalyst(); }

/* ---------- SCOUT ---------- */
function renderScout(){
  const v=view();
  if(STEP==="name"){ v.innerHTML=scoutNameHTML(); return; }
  CUR=CUR||currentMatch();
  if(!CUR){ v.innerHTML=`<p class="eyebrow">Scouting</p><div class="empty">Every match is recorded. Switch to <b>Analyst</b> to read the data.</div>`; return; }
  if(STEP==="match")   v.innerHTML=matchHTML();
  else if(STEP==="record") { v.innerHTML=recordHTML(); }
  else if(STEP==="process"){ v.innerHTML=processHTML(); runProcessing(); }
  else if(STEP==="rate")   v.innerHTML=rateHTML();
  else if(STEP==="note")   v.innerHTML=noteHTML();
  else if(STEP==="done")   v.innerHTML=doneHTML();
}

function scoutNameHTML(){
  return `<p class="eyebrow">Pick your name</p>
  <div class="panel">
    <select id="scoutSel">${SCOUTS.map(s=>`<option>${s}</option>`).join("")}</select>
    <div class="help">In the live app this is your scout login. The current match is then chosen for you automatically.</div>
    <div class="actions"><button class="btn" onclick="chooseScout()">Start scouting</button></div>
  </div>`;
}
function chooseScout(){SCOUT=document.getElementById("scoutSel").value;STEP="match";CUR=currentMatch();render();}

function teamChip(t,al){const T=TEAMS[t];const our=T.num===OUR;
  return `<div class="chip ${our?'ours':''}">
    <div class="n">${t}${our?'<span class="tag-our">OURS</span>':''}</div>
    <div class="nm">${T.name}</div>
    <div class="ctx">2026: EPA ~${T.epa} | OPR ${T.opr} | ${T.archetype}</div>
  </div>`;}

function matchHTML(){
  return `<p class="eyebrow">Your match · chosen automatically</p>
  <div class="panel">
    <div class="matchhead"><span class="qm">QM ${CUR.n}</span><span class="sub">one match runs at a time — this is the one in progress</span></div>
    <div class="field">
      <div class="side" data-a="red"><h3>Red alliance</h3>${CUR.red.map(t=>teamChip(t,'red')).join("")}</div>
      <div class="side" data-a="blue"><h3>Blue alliance</h3>${CUR.blue.map(t=>teamChip(t,'blue')).join("")}</div>
    </div>
    <div class="actions"><button class="btn rec" onclick="STEP='record';render()">● Record this match</button></div>
    <div class="help">All you do is record. The AI handles the per-robot read; you confirm with ratings after.</div>
  </div>`;
}

let recTimer=null, recT=0, CAMERA=null;
async function startCamera(){
  if(CAMERA)return;
  const vid=document.getElementById('preview'), fb=document.getElementById('camfallback');
  if(!vid)return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no-media-api');
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(!document.getElementById('preview')){stream.getTracks().forEach(t=>t.stop());return;} // left the step mid-await
    CAMERA=stream; vid.srcObject=stream; if(fb)fb.style.display='none';
  }catch(e){
    if(fb){fb.style.display='flex'; const m=fb.querySelector('.fbmsg');
      if(m)m.textContent='Live camera isn\u2019t available in this preview — on a phone the field feed would show here. The simulated timeline keeps running.';}
  }
}
function stopCamera(){ if(CAMERA){CAMERA.getTracks().forEach(t=>t.stop()); CAMERA=null;} }
function recordHTML(){
  return `<p class="eyebrow">Recording QM ${CUR.n}</p>
  <div class="panel live">
    <div class="recorder">

// Estimated climb points per robot from its archetype (real-data proxy for TRAVERSAL)
function climbEst(t){if(t===OUR)return 0;const a=TEAMS[t].archetype;if(a.includes('climber'))return 28;if(a.includes('hybrid'))return 14;if(a.includes('cycler'))return 8;if(a.includes('feeder')||a.includes('ferry'))return 4;if(a.includes('defender'))return 2;return 6;}
// Rank every team by ranking points, computed from scouted match data:
// per match we sum each alliance's fuel (AI estimates) + climb, decide the
// result, apply REBUILT RP rules, and credit each robot on that alliance.
function rpRanking(){
  const agg={};
  const add=(t,rp,c)=>{const a=agg[t]||(agg[t]={team:t,m:0,rp:0,fuel:0,energ:0,trav:0,wins:0});a.m++;a.rp+=rp;a.fuel+=c.fuel;a.energ+=c.energ;a.trav+=c.trav;a.wins+=c.win;};
  Object.entries(STORE).forEach(([key,rec])=>{
    const m=MATCHES.find(x=>x.key===key);if(!m)return;
    const side=teams=>{const fuel=teams.reduce((s,t)=>s+((rec.obs[t]&&rec.obs[t].fuel)||0),0);const climb=teams.reduce((s,t)=>s+climbEst(t),0);return {fuel,climb,total:fuel+climb};};
    const R=side(m.red),B=side(m.blue);
    const rpOf=(s,o)=>{const win=s.total>o.total?1:0,tie=s.total===o.total?1:0;const e=s.fuel>=100?1:0,sc=s.fuel>=360?1:0,tr=s.climb>=50?1:0;return {rp:(win?3:tie?1:0)+e+sc+tr,energ:e,trav:tr,win};};
    const rR=rpOf(R,B),rB=rpOf(B,R);
    m.red.forEach(t=>add(t,rR.rp,{fuel:(rec.obs[t]&&rec.obs[t].fuel)||0,energ:rR.energ,trav:rR.trav,win:rR.win}));
    m.blue.forEach(t=>add(t,rB.rp,{fuel:(rec.obs[t]&&rec.obs[t].fuel)||0,energ:rB.energ,trav:rB.trav,win:rB.win}));
  });
  return Object.values(agg).map(a=>({team:a.team,name:TEAMS[a.team].name,matches:a.m,avgRP:+(a.rp/a.m).toFixed(2),totalRP:a.rp,avgFuel:Math.round(a.fuel/a.m),winRate:Math.round(a.wins/a.m*100),energRate:Math.round(a.energ/a.m*100),travRate:Math.round(a.trav/a.m*100)})).sort((x,y)=>y.avgRP-x.avgRP||y.totalRP-x.totalRP);
}

/* --- field playback: squares move along synthesized per-robot paths -------
   Stands in for TBA Zebra MotionWorks. Paths are seeded per match so they're
   stable across re-renders. With real Zebra data these become true tracks. */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const HUB_HW=0.045, HUB_Y0=0.18, HUB_Y1=0.82, HUBX={red:0.337,blue:0.663};
const FIELD={x0:0.145,x1:0.855,y0:0.10,y1:0.90};
// hubs are tall vertical bars — push a point horizontally out to its near edge
function avoidHubs(x,y){for(const cx of [HUBX.red,HUBX.blue]){if(y>HUB_Y0&&y<HUB_Y1&&Math.abs(x-cx)<HUB_HW){x = x<cx ? cx-HUB_HW : cx+HUB_HW;}}return [x,y];}
function genPaths(m){
  if(PATHS[m.key])return PATHS[m.key];
  const r=rng(m.n*7919+13), robots=[];
  const rec=STORE[m.key];
  const shiftOf=t=>{ if(t<30)return 0; return Math.max(0,Math.min(3,Math.floor((t-30)/25))); };
  function mk(team,alliance,role){
    const ai=rec?rec.obs[team]:null;
    const shifts=ai&&ai.shifts?ai.shifts:null;
    const maxShift=shifts?Math.max(1,...shifts):1;
    const brokeDown=ai&&/disabled|broke/i.test((ai.didWell||'')+(ai.didPoorly||''));
    const ph0=r()*6.28, ph2=r()*6.28;
    const isRed=alliance==='red';
    const depotX=isRed?0.17:0.83;                 // pick up balls at own depot (the ball crates)
    const scoreX=isRed?0.275:0.725;               // score just OUTSIDE own hub — stays on our side of the bar
    let A,B,C,rx=0,ry=0,defender=false;
    if(role.includes('defender')){defender=true;C={x:isRed?0.55:0.45,y:0.5};rx=0.06;ry=0.30;} // patrol the open centre corridor between the hubs
    else {A={x:depotX,y:0.24+r()*0.52};B={x:scoreX,y:0.42+r()*0.16};}                          // shuttle balls -> own hub
    const samples=[]; let phase=ph0;
    for(let t=0;t<=DUR;t++){
      let act; if(shifts) act=0.15+0.9*(shifts[shiftOf(t)]/maxShift); else act=defender?0.85:0.7;
      if(brokeDown&&t>DUR*0.5) act*=0.1;
      phase+=0.5*act;                             // faster cadence
      let x,y;
      if(defender){x=C.x+rx*Math.sin(phase);y=C.y+ry*Math.sin(1.5*phase+ph2);}
      else{const u=(Math.sin(phase)+1)/2;x=A.x+(B.x-A.x)*u+(r()-0.5)*0.006;y=A.y+(B.y-A.y)*u+(r()-0.5)*0.025;}
      [x,y]=avoidHubs(x,y);
      samples.push({x:Math.max(FIELD.x0,Math.min(FIELD.x1,x)),y:Math.max(FIELD.y0,Math.min(FIELD.y1,y))});
    }
    robots.push({team,alliance,role,samples});
  }
  m.red.forEach(t=>mk(t,'red',TEAMS[t].archetype));
  m.blue.forEach(t=>mk(t,'blue',TEAMS[t].archetype));
  PATHS[m.key]=robots;return robots;
}

function initPlayer(matchKey){
  stopPlayer();
  const m=MATCHES.find(x=>x.key===matchKey)||MATCHES[0];
  PLAYER_MATCH=m.key;
  const robots=genPaths(m);
  const routes=document.getElementById('routes'),trails=document.getElementById('trails'),bots=document.getElementById('bots');
  if(!routes)return;
  routes.innerHTML='';trails.innerHTML='';bots.innerHTML='';
  const NS='http://www.w3.org/2000/svg', refs=[];
  robots.forEach(rb=>{
    const col=rb.team===OUR?'#c79a2f':(rb.alliance==='red'?'#c8362f':'#2f5bc8');
    const txt=rb.team===OUR?'#231900':'#fff';
    const pts=rb.samples.map(s=>`${(s.x*540).toFixed(1)},${(s.y*270).toFixed(1)}`).join(' ');
    routes.insertAdjacentHTML('beforeend',`<polyline points="${pts}" fill="none" stroke="${col}" stroke-opacity="0.16" stroke-width="2"/>`);
    const trail=document.createElementNS(NS,'polyline');
    trail.setAttribute('fill','none');trail.setAttribute('stroke',col);trail.setAttribute('stroke-width','2.5');trail.setAttribute('stroke-linejoin','round');trail.setAttribute('points','');
    trails.appendChild(trail);
    const g=document.createElementNS(NS,'g');g.setAttribute('class','robot');
    g.innerHTML=`<rect x="-10" y="-10" width="20" height="20" rx="3" fill="${col}" stroke="#fff" stroke-width="1.5"/><text fill="${txt}">${rb.team}</text>`;
    bots.appendChild(g);
    refs.push({samples:rb.samples,g,trail});
  });
  PLAYER={matchKey:m.key,robots:refs,t:0,playing:false,speed:1,raf:0,last:0};
  applyFrame();updatePlayBtn();
}
function posAt(s,t){const i=Math.max(0,Math.min(s.length-2,Math.floor(t))),a=s[i],b=s[i+1],f=t-i;return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f};}
function applyFrame(){
  if(!PLAYER)return;const t=PLAYER.t;
  PLAYER.robots.forEach(rb=>{
    const p=posAt(rb.samples,t);
    rb.g.setAttribute('transform',`translate(${(p.x*540).toFixed(1)},${(p.y*270).toFixed(1)})`);
    const upto=Math.floor(t);let pts='';
    for(let i=0;i<=upto;i++)pts+=`${(rb.samples[i].x*540).toFixed(1)},${(rb.samples[i].y*270).toFixed(1)} `;
    pts+=`${(p.x*540).toFixed(1)},${(p.y*270).toFixed(1)}`;
    rb.trail.setAttribute('points',pts.trim());
  });
  const cl=document.getElementById('pclock');if(cl){const mm=Math.floor(t/60),ss=String(Math.floor(t%60)).padStart(2,'0');cl.textContent=`${mm}:${ss}`;}
  const sc=document.getElementById('scrub');if(sc&&document.activeElement!==sc)sc.value=t;
  const ph=document.getElementById('pphase');if(ph)ph.textContent=t<20?'AUTO':t<45?'SHIFT 1':t<70?'SHIFT 2':t<95?'SHIFT 3':t<130?'SHIFT 4':'END GAME';
}
function tick(now){
  if(!PLAYER||!PLAYER.playing)return;
  if(!document.getElementById('fieldRoot')){stopPlayer();return;}
  const dt=(now-PLAYER.last)/1000*PLAYER.speed;PLAYER.last=now;
  PLAYER.t=Math.min(DUR,PLAYER.t+dt);applyFrame();
  if(PLAYER.t>=DUR){PLAYER.playing=false;updatePlayBtn();return;}
  PLAYER.raf=requestAnimationFrame(tick);
}
function playToggle(){if(!PLAYER)return;if(PLAYER.t>=DUR)PLAYER.t=0;PLAYER.playing=!PLAYER.playing;PLAYER.last=performance.now();updatePlayBtn();if(PLAYER.playing)PLAYER.raf=requestAnimationFrame(tick);}
function restartPlayer(){if(!PLAYER)return;PLAYER.t=0;applyFrame();}
function scrubTo(v){if(!PLAYER)return;PLAYER.playing=false;updatePlayBtn();PLAYER.t=Number(v);applyFrame();}
function cycleSpeed(){if(!PLAYER)return;PLAYER.speed=PLAYER.speed===1?2:PLAYER.speed===2?4:1;const b=document.getElementById('speedbtn');if(b)b.textContent=PLAYER.speed+'×';}
function updatePlayBtn(){const b=document.getElementById('playbtn');if(b)b.textContent=(PLAYER&&PLAYER.playing)?'❚❚ Pause':'► Play';}
function stopPlayer(){if(PLAYER){PLAYER.playing=false;if(PLAYER.raf)cancelAnimationFrame(PLAYER.raf);}}

function initBoard(key){
  ['auto','teleop'].forEach(phase=>{
    const svg=document.getElementById('bsvg-'+phase);if(!svg)return;
    const d=boardData(key,phase);
    let dragTeam=null,drawing=null,poly=null;
    const P=e=>{const r=svg.getBoundingClientRect();return {x:(e.clientX-r.left)*(720/r.width),y:(e.clientY-r.top)*(351/r.height)};};
    svg.onpointerdown=e=>{const p=P(e);
      if(BOARD_TOOL==='move'){const g=e.target.closest('.brobot');if(g){dragTeam=Number(g.dataset.team);try{svg.setPointerCapture(e.pointerId);}catch(_){}}}
      else if(BOARD_TOOL==='draw'){drawing=[p];poly=document.createElementNS('http://www.w3.org/2000/svg','polyline');poly.setAttribute('fill','none');poly.setAttribute('stroke',BOARD_COLOR);poly.setAttribute('stroke-width','3.5');poly.setAttribute('stroke-linecap','round');poly.setAttribute('stroke-linejoin','round');document.getElementById('strokes-'+phase).appendChild(poly);try{svg.setPointerCapture(e.pointerId);}catch(_){}}
      else if(BOARD_TOOL==='erase'){d.strokes=d.strokes.filter(s=>!s.pts.some(sp=>Math.hypot(sp.x-p.x,sp.y-p.y)<14));renderBoardLayer(key,phase);}
    };
    svg.onpointermove=e=>{const p=P(e);
      if(dragTeam!=null){d.pos[dragTeam]={x:p.x,y:p.y};const g=svg.querySelector('.brobot[data-team="'+dragTeam+'"]');if(g)g.setAttribute('transform','translate('+p.x+','+p.y+')');}
      else if(drawing){drawing.push(p);poly.setAttribute('points',drawing.map(q=>q.x.toFixed(1)+','+q.y.toFixed(1)).join(' '));}
    };
    const up=()=>{if(drawing&&drawing.length>1)d.strokes.push({pts:drawing,color:BOARD_COLOR});dragTeam=null;drawing=null;poly=null;};
    svg.onpointerup=up;svg.onpointercancel=up;
  });
}

  return `<p class="eyebrow" style="margin-top:14px">Auto RP calculator — ${ourAlliance(key).toUpperCase()} (ours)</p>
   <div class="panel">
     <div style="display:grid;grid-template-columns:60px 1fr 1fr;gap:6px;font-size:.68rem;color:var(--ink-soft)"><span>Robot</span><span>FUEL</span><span>Climb pts</span></div>
     ${teams.map((t,i)=>row(t,i)).join("")}
     <div style="display:grid;grid-template-columns:60px 1fr 1fr;gap:6px;align-items:center;margin-top:8px;border-top:1px solid var(--line);padding-top:8px">
       <b style="font-size:.78rem">Opp</b>
       <input type="number" min="0" id="arOppF" value="${st.oppF||0}" oninput="autoRPInput('${key}')" placeholder="opp fuel">
       <input type="number" min="0" id="arOppC" value="${st.oppC||0}" oninput="autoRPInput('${key}')" placeholder="opp climb"></div>
     <div id="autorpOut" style="margin-top:10px"></div>
     <p class="help">Totals and ranking points update automatically as you type — projected RP for our alliance.</p>
   </div>`;
}
function autoRPInput(key){
  const g=id=>{const e=document.getElementById(id);return e?Math.max(0,Number(e.value)||0):0;};
  const our=[0,1,2].map(i=>({f:g('arF'+i),c:g('arC'+i)}));
  AUTORP[key]={our,oppF:g('arOppF'),oppC:g('arOppC')};
  const ourF=our.reduce((s,r)=>s+r.f,0),ourC=our.reduce((s,r)=>s+r.c,0);
  const oppF=g('arOppF'),oppC=g('arOppC');
  const ot=ourF+ourC,pt=oppF+oppC,res=ot>pt?'Win':ot<pt?'Loss':'Tie';
  const rp=(res==='Win'?3:res==='Tie'?1:0)+(ourF>=100?1:0)+(ourF>=360?1:0)+(ourC>=50?1:0);
  const out=document.getElementById('autorpOut');if(!out)return;
  const ln=(n,ok,t)=>`<div style="display:flex;justify-content:space-between;color:${ok?'var(--good)':'var(--ink-soft)'}"><span>${n}</span><span>${t}</span></div>`;
  out.innerHTML=`<div class="card"><h4>Projected — ${ourAlliance(key).toUpperCase()} alliance</h4>
    <div style="display:flex;justify-content:space-between"><span>Alliance FUEL / Climb</span><b>${ourF} / ${ourC}</b></div>
    ${ln('Match result · '+res,res==='Win',res==='Win'?'+3 RP':res==='Tie'?'+1 RP':'+0 RP')}
    ${ln('ENERGIZED (100+ fuel)',ourF>=100,ourF>=100?'+1 RP':'need '+(100-ourF))}
    ${ln('SUPERCHARGED (360+ fuel)',ourF>=360,ourF>=360?'+1 RP':'need '+(360-ourF))}
    ${ln('TRAVERSAL (50+ climb)',ourC>=50,ourC>=50?'+1 RP':'need '+(50-ourC))}
    <div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><b>Projected RP</b><b style="font-size:1.15rem">${rp}</b></div></div>`;
}
function stratPitMap(){
  const nums=Object.keys(TEAMS).map(Number);
  return `<div class="panel"><div class="pitgrid">${nums.map(n=>`<div class="pitbox" style="${n===OUR?'border-color:var(--gold);background:var(--gold-tint)':''}">${n}</div>`).join("")}</div>
    <p class="help">Schematic pit layout — in the real app this maps to the venue's actual pit aisles.</p></div>`;
}
function stratTeams(){
  const agg=Object.fromEntries(teamAgg().map(r=>[r.team,r]));
  const nums=Object.keys(TEAMS).map(Number).sort((a,b)=>TEAMS[b].epa-TEAMS[a].epa);
  const cell=v=>v!=null?avgPill(v):'<span class="pill none">—</span>';
  return `<div class="tablewrap"><table><thead><tr><th>Team</th><th>Archetype</th><th>EPA</th><th>Score</th><th>Def</th></tr></thead>
    <tbody>${nums.map(n=>{const a=agg[n];return `<tr onclick="DRILL=${n};setAnalystView('dash')"><td>${n} <span class="muted">${TEAMS[n].name}</span></td><td>${TEAMS[n].archetype}</td><td>${TEAMS[n].epa}</td><td>${cell(a&&a.scoreAvg)}</td><td>${cell(a&&a.defAvg)}</td></tr>`;}).join("")}</tbody></table></div>
    <p class="help">Tap a team to open its full scouting detail on the Dashboard.</p>`;
}
function stratFreeStrat(){
  return `<div class="panel">
    <canvas id="stratcanvas" width="540" height="300"></canvas>
    <div class="actions" style="margin-top:8px"><button class="btn ghost" onclick="clearStrat()">Clear board</button></div>
    <p class="help">Freehand board — draw plays with finger or mouse. (The real app adds multi-colour pens and a field background.)</p></div>`;
}
function initFreeStrat(){
  const c=document.getElementById('stratcanvas');if(!c)return;
  const ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#c8362f';
  let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left,cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return {x:cx*(c.width/r.width),y:cy*(c.height/r.height)};};
  c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
  c.onpointerup=()=>{drawing=false;};c.onpointerleave=()=>{drawing=false;};
}
function clearStrat(){const c=document.getElementById('stratcanvas');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height);}

function renderAnalyst(){
  const v=view();
  if(DRILL){v.innerHTML=drillHTML(DRILL);return;}
  const rows=teamAgg();
  if(ANALYST_VIEW==='play'){v.innerHTML=analystSubnav()+playerHTML();initPlayer(currentPlayerMatchKey());return;}
  if(ANALYST_VIEW==='highlights'){v.innerHTML=analystSubnav()+highlightsHTML();return;}
  if(ANALYST_VIEW==='team'){v.innerHTML=analystSubnav()+teamHTML();return;}
  if(ANALYST_VIEW==='strategy'){v.innerHTML=analystSubnav()+strategyHTML();afterStrategyRender();return;}
  if(!rows.length){v.innerHTML=analystSubnav()+`<p class="eyebrow">Team picture</p><div class="empty">No matches recorded yet. Switch to <b>Scout</b> and record one — or explore the Awards, Highlights, and Team tabs above.</div>`;return;}

  // --- KPI strip
  const scored=rows.filter(r=>r.fuelAvg!=null);
  const avgFuel=scored.length?Math.round(scored.reduce((a,r)=>a+r.fuelAvg,0)/scored.length):0;
  const notes=eventNotes();
  const kpis=`<div class="kpis">
    <div class="kpi"><div class="v">${rows.length}</div><div class="l">teams scouted</div></div>
    <div class="kpi"><div class="v">${Object.keys(STORE).length}</div><div class="l">matches recorded</div></div>
    <div class="kpi"><div class="v">${avgFuel}</div><div class="l">avg fuel / team</div></div>
    <div class="kpi"><div class="v">${notes.length}</div><div class="l">intel notes</div></div>
  </div>`;

  // --- scoring x defence quadrant
  const sd=rows.filter(r=>r.scoreAvg!=null&&r.defAvg!=null).map(r=>({
    x:r.scoreAvg,y:r.defAvg,team:r.team,our:r.team===OUR,
    color:r.team===OUR?'#c79a2f':(r.scoreAvg>=3?'#2f5bc8':(r.defAvg>=3?'#c8362f':'#5a626d'))
  }));
  const quad=scatterSVG(sd,{xmin:1,xmax:4,ymin:1,ymax:4,xlab:'scoring →',ylab:'defence →',quad:true,
    quadLabels:[{x:298,y:26,t:'all-round'},{x:74,y:26,t:'defenders'},{x:300,y:212,t:'scorers'},{x:74,y:212,t:'limited'}]});

  // teams that have a fuel estimate (feeds the top-scorers chart)
  const ef=rows.filter(r=>r.fuelAvg!=null);

  // --- top scorers
  const top=[...ef].sort((a,b)=>b.fuelAvg-a.fuelAvg).slice(0,8)
    .map(r=>({label:`${r.team}`,value:r.fuelAvg,color:r.team===OUR?'#c79a2f':'#2f5bc8'}));
  const topBars=top.length?hbarSVG(top):`<div class="sub">No fuel data yet.</div>`;

  // --- table
  const cols=[["team","Team"],["matches","M"],["epa","EPA"],["opr","OPR"],["fuelAvg","Fuel~"],["scoreAvg","Score"],["defAvg","Def"]];
  rows.sort((a,b)=>{const k=SORT.key;let av=a[k],bv=b[k];if(k==='team')return SORT.dir*(av-bv);av=av==null?-1:av;bv=bv==null?-1:bv;return SORT.dir*(av-bv);});
  const table=`<div class="tablewrap"><table>
      <thead><tr>${cols.map(c=>`<th onclick="sortBy('${c[0]}')">${c[1]}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r=>`<tr onclick="DRILL=${r.team};render()">
        <td><span class="dot ${r.conf}"></span>${r.team} <span class="muted">${r.name}</span></td>
        <td>${r.matches}</td><td>${r.epa}</td><td>${r.opr}</td>
        <td>${r.fuelAvg??'—'}</td><td>${avgPill(r.scoreAvg)}</td><td>${avgPill(r.defAvg)}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;

  const intel=notes.length?`<p class="eyebrow">Scout intel · standout notes</p>
    <div class="notesfeed">${notes.map(x=>`<div class="item"><b>QM ${x.n} · ${x.scout}:</b> ${x.note}</div>`).join("")}</div>`:"";

  v.innerHTML=analystSubnav()+`<p class="eyebrow">Event dashboard <span class="simflag">simulated</span></p>
    ${kpis}
    ${rpBoardHTML()}
    <div class="charts">
      <div class="card"><h4>Scoring × defence</h4><div class="cap">alliance-selection lens — each robot placed by scout ratings</div>${quad}</div>
      <div class="card"><h4>Top fuel scorers</h4><div class="cap">avg estimated fuel / match</div>${topBars}</div>
      <div class="card"><h4>Coverage</h4><div class="cap">how complete the picture is</div>
        <div class="legend" style="margin:6px 0 0"><span><span class="dot full"></span>2+ matches</span><span><span class="dot part"></span>1 match</span><span><span class="dot none"></span>thin</span></div>
        <p class="sub" style="margin-top:8px">${rows.filter(r=>r.conf==='full').length} of ${rows.length} teams have 2+ matches of data. Thin rows are lower-confidence reads.</p>
      </div>
    </div>

    <p class="eyebrow">Team table · tap a row to drill in</p>
    ${table}
    <p class="help">Score/Def are scout ratings (4 exceptional → 1 bad; “no evidence” excluded). EPA/OPR are feed values; fuel is the AI estimate.</p>
    ${intel}`;
}
function sortBy(k){if(SORT.key===k)SORT.dir*=-1;else{SORT.key=k;SORT.dir=-1;}render();}

function drillHTML(team){
  const T=TEAMS[team];
  const recs=Object.entries(STORE).filter(([_,r])=>r.ratings[team]).map(([mk,r])=>({mk,n:MATCHES.find(m=>m.key===mk).n,ai:r.obs[team],rt:r.ratings[team],note:r.note,scout:r.scout})).sort((a,b)=>a.n-b.n);
  const fuelMax=Math.max(10,...recs.map(x=>x.ai?x.ai.fuel:0));

  // charts
  const trend=lineSVG(recs.map(x=>({x:'Q'+x.n,y:x.ai?x.ai.fuel:0})));
  const shiftAgg=[0,0,0,0],sc=recs.filter(x=>x.ai&&x.ai.shifts);
  sc.forEach(x=>x.ai.shifts.forEach((v,i)=>shiftAgg[i]+=v));
  const shiftAvg=shiftAgg.map(v=>sc.length?Math.round(v/sc.length):0);
  const counts={};recs.forEach(x=>{counts[x.rt.scoring]=(counts[x.rt.scoring]||0)+1;});

  const charts=`<div class="charts">
    <div class="card"><h4>Fuel trend</h4><div class="cap">estimated fuel per match — consistency vs fade</div>${trend}</div>
    <div class="card"><h4>Shift tempo</h4><div class="cap">avg fuel by REBUILT shift</div>${shiftAvg.some(v=>v>0)?shiftSVG(shiftAvg):'<div class="sub">No scoring (defender/ferry).</div>'}</div>
    <div class="card" style="grid-column:1/-1"><h4>Scoring rating consistency</h4><div class="cap">how the scout rated this robot across matches</div>${distSVG(counts)}
      <div class="legend" style="margin-top:6px"><span><span class="dot" style="background:#2f8a5b"></span>exceptional/good</span><span><span class="dot" style="background:#c79a2f"></span>average</span><span><span class="dot" style="background:#c8362f"></span>bad</span><span><span class="dot" style="background:#9aa1ab"></span>no evidence</span></div>
    </div>
  </div>`;

  return `<button class="back" onclick="DRILL=null;render()">← All teams</button>
  <p class="eyebrow">${team} · ${T.name} <span class="simflag">simulated</span></p>
  <div class="panel">
    <div class="kv"><span class="k">2026 season</span><span>EPA ~${T.epa} · OPR ${T.opr} · ${T.archetype}</span></div>
    <div class="kv"><span class="k">Matches scouted</span><span>${recs.length}</span></div>
  </div>
  ${charts}
  <p class="eyebrow">Match by match</p>
  ${recs.map(x=>`<div class="panel" style="margin-bottom:10px">
    <div class="top" style="display:flex;align-items:center;gap:8px"><b>QM ${x.n}</b>
      <span class="pill ${x.rt.scoring}">score: ${RLABEL[x.rt.scoring]}</span>
      <span class="pill ${x.rt.defence}">def: ${RLABEL[x.rt.defence]}</span>
      <span class="spacer" style="flex:1"></span>${x.ai?`<span class="est">${x.ai.fuel} fuel</span>`:''}</div>
    ${x.ai?`<div style="margin:8px 0"><span class="bar" style="width:${Math.round((x.ai.fuel/fuelMax)*100)}%"></span></div>
    <div class="line sub"><b>Well:</b> ${x.ai.didWell}</div>
    ${x.ai.vuln?`<div class="line sub"><b>Vuln:</b> ${x.ai.vuln}</div>`:''}`:''}
    ${x.note?`<div class="ournote"><b>Scout (${x.scout}):</b> ${x.note}</div>`:''}
  </div>`).join("")}`;
}

// init
buildSchedule();seedPrior();render();
</script>
</body>
</html>
