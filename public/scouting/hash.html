<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Password hash · FRC 1884 roster</title>
<style>
  :root{--ink:#f0f8ff;--soft:#8badc8;--paper:#17364f;--panel:#1e4160;--line:rgba(148,210,255,.15);
    --gold:#d8ad58;--gold-tint:rgba(216,173,88,.16);--red:#ff6b5c;--blue:#6fa8ff;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:"Avenir Next",-apple-system,"Segoe UI",Roboto,sans-serif}
  body{margin:0;font-family:var(--sans);background:
      radial-gradient(circle at 15% 0%,rgba(97,179,238,.10),transparent 28rem),
      linear-gradient(168deg,#17364f,#0f2536);
    background-attachment:fixed;color:var(--ink);line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
  .mast{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:20px}
  .team{font-family:var(--mono);font-weight:700;background:var(--gold);color:#231900;padding:3px 9px;border-radius:4px}
  h1{font-size:1rem;margin:0;font-weight:650;color:var(--ink)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 30px rgba(3,10,17,.34)}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px;color:var(--ink)}
  input{width:100%;box-sizing:border-box;font-family:var(--mono);font-size:1rem;color:var(--ink);background:rgba(255,255,255,.04);padding:11px;border:1.5px solid var(--line);border-radius:9px}
  input:focus{outline:3px solid var(--gold);border-color:var(--gold)}
  button{font:inherit;font-weight:650;margin-top:12px;padding:11px 18px;border-radius:9px;border:1.5px solid var(--gold);background:var(--gold);color:#231900;cursor:pointer}
  .out{margin-top:16px;display:none}
  .hash{font-family:var(--mono);font-size:.8rem;word-break:break-all;color:var(--ink);background:var(--gold-tint);border:1px dashed var(--gold);border-radius:9px;padding:11px}
  .copy{background:var(--gold);border-color:var(--gold);color:#231900;margin-left:8px;padding:7px 13px}
  .help{font-size:.82rem;color:var(--soft);margin-top:10px}
  .err{color:var(--red);font-weight:600;font-size:.86rem;margin-top:10px;display:none}
  a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><span class="team">1884</span><h1>Roster password hash</h1></div>
  <div class="panel">
    <label for="pw">Password to hash</label>
    <input id="pw" type="text" autocomplete="off" spellcheck="false" placeholder="min 6 characters" />
    <button id="go">Generate hash</button>
    <div class="err" id="err"></div>
    <div class="out" id="out">
      <label style="margin-top:4px">Paste this into the sheet's <b>password</b> column</label>
      <div class="hash" id="hash"></div>
      <button class="copy" id="copy">Copy</button>
    </div>
    <p class="help">Give the person their password privately; only the hash goes in the sheet.
      The hash alone can't be turned back into the password and grants nothing unless it's in the roster.
      This page needs the app server running (it calls <span style="font-family:var(--mono)">/api/auth/hash</span>).
      <a href="/scouting">← back to the app</a></p>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function gen(){
  $('err').style.display='none';$('out').style.display='none';
  const password=$('pw').value;
  try{
    const r=await fetch('/api/auth/hash',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){$('err').textContent=d.error_code==='password_too_short'?'Password must be at least 6 characters.':'Could not generate — is the server running?';$('err').style.display='block';return;}
    $('hash').textContent=d.hash;$('out').style.display='block';
  }catch(_){$('err').textContent='Could not reach the server — this page only works when the app is running (not as a standalone file).';$('err').style.display='block';}
}
$('go').onclick=gen;
$('pw').onkeydown=e=>{if(e.key==='Enter')gen();};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('hash').textContent);$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy',1200);}catch(_){/* manual select fallback */}};
</script>
</body>
</html>
